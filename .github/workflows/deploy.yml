name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request: # check/build only; the deploy job below never runs on PRs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR runs get their own group (cancelled when superseded) so they can never
# displace a queued deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check
        env:
          # Absolute og:image / og:url for link previews (see vite.config.ts).
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
