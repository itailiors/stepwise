    <meta name="description" content="Morph one chord into another by sliding a single voice per move. A daily voice-leading ladder puzzle — beat Par." />
    <meta name="theme-color" content="#F5F3EE" />
    <meta property="og:title" content="STEPWISE — Daily Voice-Leading Puzzle" />
    <meta property="og:description" content="Slide one voice at a time from the Start chord to the Target. Every step must be a real chord. Beat Par." />

    <link rel="icon" type="image/svg+xml" href="./assets/brand/favicon.svg" />

      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint (no light flash for dark-mode players).
      try {
        var p = JSON.parse(localStorage.getItem('stepwise:prefs') || '{}');
        var t = p.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>
      <h1>STEPWISE — Daily Voice-Leading Puzzle</h1>
      <p>Each day you get a Start chord and a Target chord. Slide one voice at a time so every step is a real chord, and reach the Target in as few moves as Par. STEPWISE is a free daily music-theory puzzle that runs in your browser and needs JavaScript to play.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
